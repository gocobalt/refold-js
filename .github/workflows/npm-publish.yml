# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: |
          npm ci
          npm test
      # The tag must hold the refold.js that npm gets (CI checks this too, but a release can be cut
      # from a commit whose CI didn't pass).
      - name: Committed build is up to date
        run: git diff --exit-code -- refold.js refold.d.ts

  # The live UAT connect cases must pass before a release goes out.
  e2e:
    uses: ./.github/workflows/e2e-live.yml
    secrets: inherit

  publish-npm:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      # Publish what refold.ts compiles to, not whatever build happens to be committed.
      - run: npm run build
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"; TAG="${TAG%%.*}"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION with tag $TAG"
          npm publish --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
